name: Verificar sitio

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        particion: ["1/3", "2/3", "3/3"]

    steps:
      - name: Obtener el sitio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Instalar dependencias de prueba
        run: npm ci

      - name: Construir producción
        run: npm run build

      - name: Ejecutar pruebas sobre los recursos construidos
        # Cada máquina mantiene un solo navegador activo; Node distribuye
        # todos los archivos, incluidos los que se añadan en el futuro.
        run: node --test --test-concurrency=1 --test-shard=${{ matrix.particion }} pruebas/*.test.mjs
